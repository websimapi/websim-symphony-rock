<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Symphony Rock</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "howler": "https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="ui-container">
    <div id="upload-container">
      <h1>Symphony Rock</h1>
      <p>Upload audio files to the 3D symphony rock and play with others!</p>
      <div id="upload-form">
        <label for="track-name">Track Name:</label>
        <input type="text" id="track-name" placeholder="Enter track name">
        
        <label for="track-tag">Track Category:</label>
        <select id="track-tag">
          <option value="ambient">Ambient</option>
          <option value="energetic">Energetic</option>
          <option value="other">Other</option>
        </select>
        
        <input type="file" id="audio-file" accept="audio/*">
        <button id="upload-button">Upload to Rock</button>
      </div>
    </div>
    
    <div id="controls">
      <div id="current-track">
        <span id="track-info">No track playing</span>
        <div id="player-controls">
          <button id="stop-button">⏹️</button>
          <input type="range" id="volume-slider" min="0" max="100" value="80">
        </div>
      </div>
      <div id="player-list">
        <h3>Players Nearby</h3>
        <ul id="nearby-players"></ul>
      </div>
    </div>
  </div>
  
  <div id="control-help">
    <p>Move: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or Arrow Keys | Toggle View: <kbd>V</kbd> | Zoom: Mouse Wheel</p>
  </div>
  
  <canvas id="scene"></canvas>
  
  <audio id="default-track" src="/Hyrule Battle - Track 1 - Sonauto.wav" preload="auto"></audio>
  
  <script type="module" src="config.js"></script>
  <script type="module" src="app.js"></script>

</body>
</html>
